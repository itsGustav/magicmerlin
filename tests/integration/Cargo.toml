[package]
name = "magicmerlin-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
magicmerlin-agent = { path = "../../agent" }
magicmerlin-providers = { path = "../../providers" }
magicmerlin-sessions = { path = "../../sessions" }
magicmerlin-storage = { path = "../../storage" }

async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "net"] }
