<!DOCTYPE html>
<html data-theme="dark">
<head>
  <title>Magic Merlin</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
    nav { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .logo { font-weight: 700; font-size: 16px; color: var(--accent); white-space: nowrap; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tabs button { background: none; border: none; color: var(--text); padding: 6px 12px; cursor: pointer; border-radius: 6px; font-size: 13px; font-family: inherit; }
    .tabs button:hover, .tabs button.active { background: var(--accent); color: #fff; }
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .card h3 { font-size: 12px; text-transform: uppercase; color: #6e7681; margin-bottom: 12px; letter-spacing: 0.5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: #6e7681; font-weight: 500; }
    .dot-green::before { content: "\25CF"; color: var(--green); margin-right: 6px; }
    .dot-red::before { content: "\25CF"; color: var(--red); margin-right: 6px; }
    .dot-yellow::before { content: "\25CF"; color: var(--yellow); margin-right: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
    .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-red { background: rgba(248,81,73,0.15); color: var(--red); }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .log-error { color: var(--red); }
    .log-warn { color: var(--yellow); }
    .log-info { color: var(--text); }
    .log-debug { color: #6e7681; }
    #gateway-status { font-size: 20px; color: var(--green); margin-left: auto; }
    .empty { color: #6e7681; padding: 20px; text-align: center; }
    .mono { font-family: 'SF Mono', Consolas, Monaco, Menlo, monospace; font-size: 12px; }
    .error-banner { background: rgba(248,81,73,0.15); border: 1px solid var(--red); color: var(--red); padding: 10px 16px; border-radius: var(--radius); margin-bottom: 16px; display: none; }
    input[type="text"], input[type="search"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; font-family: inherit; width: 100%; }
    input[type="text"]:focus, input[type="search"]:focus { outline: none; border-color: var(--accent); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
    .btn:hover { opacity: 0.9; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .config-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .config-row input { flex: 1; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">&#x1F9D9; Magic Merlin</div>
    <div class="tabs">
      <button onclick="showTab('overview')" class="active">Overview</button>
      <button onclick="showTab('sessions')">Sessions</button>
      <button onclick="showTab('agents')">Agents</button>
      <button onclick="showTab('cron')">Cron</button>
      <button onclick="showTab('config')">Config</button>
      <button onclick="showTab('memory')">Memory</button>
      <button onclick="showTab('logs')">Logs</button>
    </div>
    <div id="gateway-status">&#x25CF;</div>
  </nav>

  <div id="error-banner" class="error-banner"></div>
  <main id="content"></main>

  <script>
    var currentTab = 'overview';
    var reconnectTimer = null;

    async function call(method, params) {
      try {
        var r = await fetch('/call', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({method: method, params: params || {}})
        });
        if (!r.ok) {
          showError('Gateway returned ' + r.status + ' for ' + method);
          return {error: r.statusText};
        }
        hideError();
        return await r.json();
      } catch(e) {
        showError('Connection lost: ' + e.message);
        return {error: e.message};
      }
    }

    function showError(msg) {
      var el = document.getElementById('error-banner');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('error-banner').style.display = 'none';
    }

    function showTab(name) {
      currentTab = name;
      var btns = document.querySelectorAll('.tabs button');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      var target = document.querySelector('.tabs button[onclick="showTab(\'' + name + '\')"]');
      if (target) target.classList.add('active');
      renderTab();
    }

    async function renderTab() {
      var el = document.getElementById('content');
      el.innerHTML = '<p class="empty">Loading\u2026</p>';
      switch(currentTab) {
        case 'overview':  el.innerHTML = await renderOverview(); break;
        case 'sessions':  el.innerHTML = await renderSessions(); break;
        case 'agents':    el.innerHTML = await renderAgents();   break;
        case 'cron':      el.innerHTML = await renderCron();     break;
        case 'config':    el.innerHTML = await renderConfig();   break;
        case 'memory':    el.innerHTML = await renderMemory();   break;
        case 'logs':      el.innerHTML = await renderLogs();     break;
      }
    }

    function escHtml(s) {
      if (typeof s !== 'string') s = String(s);
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function fmtUptime(secs) {
      if (!secs && secs !== 0) return '\u2014';
      var d = Math.floor(secs / 86400);
      var h = Math.floor((secs % 86400) / 3600);
      var m = Math.floor((secs % 3600) / 60);
      var parts = [];
      if (d) parts.push(d + 'd');
      if (h) parts.push(h + 'h');
      parts.push(m + 'm');
      return parts.join(' ');
    }

    function fmtTime(ts) {
      if (!ts) return '\u2014';
      try {
        var d = new Date(typeof ts === 'number' ? ts * 1000 : ts);
        return d.toLocaleString();
      } catch(e) { return String(ts); }
    }

    async function renderOverview() {
      var results = await Promise.all([
        call('gateway.status'),
        call('channels.list'),
        call('agents.list')
      ]);
      var s = results[0] || {};
      var chData = results[1] || {};
      var ch = chData.channels || [];
      var agData = results[2] || {};
      var agents = agData.agents || [];
      return '<div class="grid">' +
        '<div class="card">' +
          '<h3>Gateway</h3>' +
          '<table>' +
            '<tr><td>Status</td><td><span class="dot-green"></span>Online</td></tr>' +
            '<tr><td>Uptime</td><td>' + fmtUptime(s.uptime) + '</td></tr>' +
            '<tr><td>Version</td><td>' + escHtml(s.version || '0.9.0') + '</td></tr>' +
            '<tr><td>Model</td><td>' + escHtml(s.model || '\u2014') + '</td></tr>' +
            '<tr><td>PID</td><td class="mono">' + escHtml(s.pid || '\u2014') + '</td></tr>' +
            '<tr><td>Sessions</td><td>' + (s.sessions != null ? s.sessions : '\u2014') + '</td></tr>' +
          '</table>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Agents (' + agents.length + ')</h3>' +
          (agents.length === 0 ? '<p class="empty">No agents</p>' :
          '<table>' +
            '<tr><th>Name</th><th>Model</th><th>Status</th></tr>' +
            agents.map(function(a) {
              var active = a.status === 'active';
              return '<tr>' +
                '<td>' + escHtml(a.name || a.id || '') + '</td>' +
                '<td class="mono">' + escHtml(a.model || '\u2014') + '</td>' +
                '<td><span class="badge ' + (active ? 'badge-green' : 'badge-red') + '">' + escHtml(a.status || '\u2014') + '</span></td>' +
              '</tr>';
            }).join('')) +
          '</table>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Channels (' + ch.length + ')</h3>' +
          (ch.length === 0 ? '<p class="empty">No channels configured</p>' :
          '<table>' +
            ch.map(function(c) {
              var connected = c.status === 'connected' || c.configured;
              return '<tr>' +
                '<td class="' + (connected ? 'dot-green' : 'dot-red') + '">' + escHtml(c.name || c.platform || '') + '</td>' +
                '<td>' + escHtml(c.platform || c.type || '') + '</td>' +
                '<td><span class="badge ' + (connected ? 'badge-green' : 'badge-red') + '">' + escHtml(c.status || 'unknown') + '</span></td>' +
              '</tr>';
            }).join('')) +
          '</table>' +
        '</div>' +
      '</div>';
    }

    async function renderSessions() {
      var r = await call('sessions.list', {limit: 50});
      var sessions = r.sessions || [];
      return '<div class="card">' +
        '<h3>Sessions (' + sessions.length + ')</h3>' +
        (sessions.length === 0 ? '<p class="empty">No sessions</p>' :
        '<table>' +
          '<tr><th>Key</th><th>Channel</th><th>Status</th><th>Messages</th><th>Updated</th></tr>' +
          sessions.map(function(s) {
            var msgCount = s.message_count || s.messageCount || '\u2014';
            return '<tr>' +
              '<td class="mono">' + escHtml(s.key || s.id || '') + '</td>' +
              '<td>' + escHtml(s.channel || '\u2014') + '</td>' +
              '<td><span class="badge ' + (s.status === 'active' ? 'badge-green' : 'badge-red') + '">' + escHtml(s.status || '\u2014') + '</span></td>' +
              '<td>' + escHtml(msgCount) + '</td>' +
              '<td>' + fmtTime(s.updatedAt || s.updated_at) + '</td>' +
            '</tr>';
          }).join('')) +
        '</table>' +
      '</div>';
    }

    async function renderAgents() {
      var r = await call('agents.list');
      var agents = r.agents || [];
      return '<div class="card">' +
        '<h3>Agents (' + agents.length + ')</h3>' +
        (agents.length === 0 ? '<p class="empty">No agents</p>' :
        '<table>' +
          '<tr><th>Name</th><th>Model</th><th>Status</th><th>Last Message</th><th>Description</th></tr>' +
          agents.map(function(a) {
            var active = a.status === 'active';
            return '<tr>' +
              '<td>' + escHtml(a.name || a.id || '') + '</td>' +
              '<td class="mono">' + escHtml(a.model || '\u2014') + '</td>' +
              '<td><span class="badge ' + (active ? 'badge-green' : 'badge-red') + '">' + escHtml(a.status || '\u2014') + '</span></td>' +
              '<td>' + fmtTime(a.lastMessageAt || a.last_message_at) + '</td>' +
              '<td>' + escHtml(a.description || '\u2014') + '</td>' +
            '</tr>';
          }).join('')) +
        '</table>' +
      '</div>';
    }

    async function renderCron() {
      var r = await call('cron.list');
      var jobs = r.jobs || [];
      return '<div class="card">' +
        '<h3>Cron Jobs (' + jobs.length + ')</h3>' +
        (jobs.length === 0 ? '<p class="empty">No cron jobs</p>' :
        '<table>' +
          '<tr><th>ID</th><th>Name</th><th>Schedule</th><th>Last Run</th><th>Status</th></tr>' +
          jobs.map(function(j) {
            var sched = j.schedule || j.cron_expr || j.cronExpr || '\u2014';
            if (typeof sched === 'object') sched = sched.expr || sched.everyMs || JSON.stringify(sched);
            var enabled = j.enabled !== false && j.paused !== true;
            return '<tr>' +
              '<td class="mono">' + escHtml(String(j.id || '').slice(0, 8)) + '</td>' +
              '<td>' + escHtml(j.name || '\u2014') + '</td>' +
              '<td class="mono">' + escHtml(sched) + '</td>' +
              '<td>' + fmtTime(j.lastRun || j.last_run || j.lastRunAt) + '</td>' +
              '<td><span class="badge ' + (enabled ? 'badge-green' : 'badge-red') + '">' + (enabled ? 'enabled' : 'disabled') + '</span></td>' +
            '</tr>';
          }).join('')) +
        '</table>' +
      '</div>';
    }

    async function renderConfig() {
      var r = await call('config.list');
      var entries = [];
      if (r && typeof r === 'object' && !r.error) {
        // config.list may return { config: {...} } or flat key-value
        var cfg = r.config || r;
        if (typeof cfg === 'object') {
          Object.keys(cfg).forEach(function(k) {
            if (k !== 'error') entries.push({key: k, value: cfg[k]});
          });
        }
      }
      var html = '<div class="card">' +
        '<h3>Configuration (' + entries.length + ' keys)</h3>';

      // Add/edit form
      html += '<div class="config-row" style="margin-bottom:16px">' +
        '<input type="text" id="cfg-key" placeholder="Key">' +
        '<input type="text" id="cfg-val" placeholder="Value">' +
        '<button class="btn btn-sm" onclick="setConfig()">Set</button>' +
      '</div>';

      if (entries.length === 0) {
        html += '<p class="empty">No configuration entries</p>';
      } else {
        html += '<table><tr><th>Key</th><th>Value</th></tr>';
        entries.forEach(function(e) {
          var v = typeof e.value === 'object' ? JSON.stringify(e.value) : String(e.value);
          html += '<tr><td class="mono">' + escHtml(e.key) + '</td><td>' + escHtml(v) + '</td></tr>';
        });
        html += '</table>';
      }
      html += '</div>';
      return html;
    }

    async function setConfig() {
      var key = document.getElementById('cfg-key').value.trim();
      var val = document.getElementById('cfg-val').value.trim();
      if (!key) return;
      // Try to parse JSON value
      var parsed = val;
      try { parsed = JSON.parse(val); } catch(e) { /* use string */ }
      await call('config.set', {key: key, value: parsed});
      renderTab();
    }

    async function renderMemory() {
      var html = '<div class="card">' +
        '<h3>Memory Search</h3>' +
        '<div class="config-row" style="margin-bottom:16px">' +
          '<input type="search" id="mem-query" placeholder="Search memory (e.g. contract, TODO, deadline)" onkeydown="if(event.key===\'Enter\')searchMemory()">' +
          '<button class="btn btn-sm" onclick="searchMemory()">Search</button>' +
        '</div>' +
        '<div id="mem-results"><p class="empty">Enter a query to search session memories</p></div>' +
      '</div>';
      return html;
    }

    async function searchMemory() {
      var query = document.getElementById('mem-query').value.trim();
      if (!query) return;
      var el = document.getElementById('mem-results');
      el.innerHTML = '<p class="empty">Searching\u2026</p>';
      var r = await call('agent.run', {session_id: 'ui', message: '/memory ' + query});
      var reply = r.reply || r.result || r.error || 'No results';
      if (typeof reply === 'object') reply = JSON.stringify(reply, null, 2);
      el.innerHTML = '<pre>' + escHtml(reply) + '</pre>';
    }

    async function renderLogs() {
      var r = await call('logs.tail', {lines: 200});
      var entries = r.entries || [];
      if (entries.length === 0) {
        return '<div class="card"><h3>Recent Logs</h3><p class="empty">No log entries</p></div>';
      }
      var html = entries.map(function(entry) {
        var line = (typeof entry === 'string') ? entry : (entry.line || JSON.stringify(entry));
        var level = 'info';
        if (/\bERROR\b/i.test(line)) level = 'error';
        else if (/\bWARN/i.test(line)) level = 'warn';
        else if (/\bDEBUG\b/i.test(line)) level = 'debug';
        return '<span class="log-' + level + '">' + escHtml(line) + '</span>';
      }).join('\n');
      return '<div class="card"><h3>Recent Logs (' + entries.length + ')</h3><pre>' + html + '</pre></div>';
    }

    async function refresh() {
      await renderTab();
      try {
        var r = await fetch('/health');
        if (r.ok) {
          document.getElementById('gateway-status').style.color = 'var(--green)';
          hideError();
        } else {
          document.getElementById('gateway-status').style.color = 'var(--red)';
          showError('Gateway health check failed (HTTP ' + r.status + ')');
        }
      } catch(e) {
        document.getElementById('gateway-status').style.color = 'var(--red)';
        showError('Connection lost \u2014 reconnecting\u2026');
      }
    }

    setInterval(refresh, 5000);
    renderTab();
  </script>
</body>
</html>
