[package]
name = "magicmerlin-agent-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
magicmerlin-config = { path = "../config" }
magicmerlin-infra = { path = "../infra" }
magicmerlin-providers = { path = "../providers" }
magicmerlin-media = { path = "../media" }
magicmerlin-storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "process", "io-util", "time", "fs"] }
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = "0.32"
base64 = "0.22"
scraper = "0.19"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
